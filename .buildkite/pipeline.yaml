steps:
  - group: QA
    steps:
      - label: ":golangci-lint: Lint"
        key: lint
        timeout_in_minutes: 20
        plugins:
          - mise#v1.1.5:
              install_args: go golangci-lint
        command: golangci-lint run

      - label: ":golang: Test"
        key: test
        timeout_in_minutes: 20
        plugins:
          - mise#v1.1.5:
              install_args: go
          - wolfeidau/go-test-annotate#v1.0.0:
              file: tests.json
        command: go test -count=1 -json -coverprofile=coverage.out ./... > tests.json
        artifact_paths:
          - coverage.out
          - tests.json
